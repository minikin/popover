name: popover
description: A popover is a transient view that appears above other content onscreen when you tap a control or in an area.
version: 0.5.0
homepage: https://github.com/minikin/popover
repository: https://github.com/minikin/popover

screenshots:
  - description: The example app with open popovers on macOS, iPad, iPhone, Android, Windows, Linux and the web.
    path: assets/demo-light.webp

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  cupertino_ui: ^1.1.2
  flutter_test:
    sdk: flutter
  leak_tracker_flutter_testing: 3.0.10
  material_ui: ^1.6.0
  mutation_test: ^1.8.1
