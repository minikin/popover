name: On Pull Request

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: .fvmrc

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test example

      - name: Analyzing project
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub --coverage --test-randomize-ordering-seed random

      - name: Keep coverage for the badge
        if: github.event_name == 'push' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 30
          if-no-files-found: ignore

      - name: Check Code Coverage
        uses: VeryGoodOpenSource/very_good_coverage@03275e99cea6981679254681dbdb65b52155b88c # v1.1.1
        with:
          path: coverage/lcov.info
          min_coverage: 90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@29386c70ef20e286228c72b668a06fd0e8399192 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
