name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DRIVE_ARGS: --driver test_driver/integration_test.dart --target integration_test/popover_test.dart

jobs:
  apple:
    name: E2E iOS and macOS
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Pick simulators
        run: |
          python3 - >> "$GITHUB_ENV" <<'EOF'
          import json, re, subprocess
          listing = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))
          runtimes = sorted(
              (r for r in listing["devices"] if ".iOS-" in r), reverse=True)
          def pick(pattern):
              for runtime in runtimes:
                  for device in listing["devices"][runtime]:
                      if re.match(pattern, device["name"]):
                          return device["udid"]
              raise SystemExit(f"no simulator matches {pattern}")
          print(f"IPHONE={pick(r'iPhone \d+ Pro$')}")
          print(f"IPAD={pick(r'iPad Pro 1[13]-inch')}")
          EOF

      - name: Build for the simulator
        timeout-minutes: 20
        run: flutter build ios --simulator --debug --target integration_test/popover_test.dart

      - name: iPhone
        timeout-minutes: 15
        run: |
          xcrun simctl boot "$IPHONE"
          xcrun simctl bootstatus "$IPHONE" -b
          xcrun simctl list devices booted
          status=0
          flutter drive -d "$IPHONE" $DRIVE_ARGS || status=$?
          xcrun simctl shutdown "$IPHONE"
          exit $status

      - name: iPad
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          flutter drive -d "$IPAD" $DRIVE_ARGS

      - name: macOS
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: flutter drive -d macos $DRIVE_ARGS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-apple
          path: example/build/screenshots

  web:
    name: E2E web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Chrome
        run: |
          version=$(google-chrome --version | grep -oE '[0-9]+(\.[0-9]+){3}')
          npx -y @puppeteer/browsers install "chromedriver@$version" --path "$RUNNER_TEMP"
          driver=$(find "$RUNNER_TEMP/chromedriver" -type f -name chromedriver | head -n 1)
          "$driver" --port=4444 &
          flutter drive -d web-server --browser-name=chrome --headless $DRIVE_ARGS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-web
          path: example/build/screenshots

  android:
    name: E2E Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: example
          script: flutter drive -d emulator-5554 $DRIVE_ARGS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-android
          path: example/build/screenshots

  windows:
    name: E2E Windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Windows
        run: flutter drive -d windows $DRIVE_ARGS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-windows
          path: example/build/screenshots

  linux:
    name: E2E Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: example

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Linux
        run: xvfb-run -a -s "-screen 0 1600x1200x24" flutter drive -d linux $DRIVE_ARGS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-screenshots-linux
          path: example/build/screenshots

  demo:
    name: Demo image
    needs: [apple, web, android, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-screenshots-*
          merge-multiple: true
          path: screenshots

      - name: Render
        run: tool/demo/render.sh screenshots demo.png

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popover-demo
          path: demo.png
