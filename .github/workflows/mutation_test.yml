name: Mutation Test

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: Mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version: "3.47.4"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Plan shards
        run: python3 tool/ci/mutation_shards.py plan 6 build/mutation

      - name: Run mutation test
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          dart run mutation_test -o "build/mutation-test-report/shard-$SHARD" \
            "build/mutation/shard_$SHARD.xml" | tee "build/mutation/shard_$SHARD.log"

      - name: Upload log and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: |
            build/mutation/shard_${{ matrix.shard }}.log
            build/mutation-test-report

  mutation-test:
    name: Mutation test
    needs: shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: All shards finished
        env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-shard-*
          path: shards

      - name: Check the threshold
        run: python3 tool/ci/mutation_shards.py total shards
